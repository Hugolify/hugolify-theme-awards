module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts

# Permalinks
permalinks:
  page:
    awards: /awards/:slug/

# Params
params:
  
  # Admin
  admin:
    collections:
      awards:
        enable: true
        filter:
          - field: isIndex
            value: false
        icon:
          bootstrap_icons: award
          iconoir: medal
          lucide: award
          material_icons: trophy
          material_symbols: trophy
        path: "{{slug}}"
  
  # Image
  awards:
    image:
      # Award artwork is mostly logos: filling the thumbnail box would cut into the mark, so images
      # are resized to the sizes below and contained inside the box with bleed around.
      # Set to true (or to a fill anchor, e.g. smart) to crop instead.
      crop: false
    thumbnail:
      desktop: '416x416'
      desktop_large: '636x636'
      mobile: '150x175'
      scrollsnap: '240x300'
